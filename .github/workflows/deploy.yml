name: CI Build Pipeline

on:
  push:
    branches:
      - main # Change to 'master' if that is your primary branch name

jobs:
  build:
    name: Verify Docker Architecture
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout Code
        uses: actions/checkout@v4

      - name:  Test Docker Compose Build
        run: |
          echo "Building enterprise Docker architecture..."
          docker-compose build