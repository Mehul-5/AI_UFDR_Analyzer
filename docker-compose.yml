version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: ufdr-postgres

    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ufdr_user
      POSTGRES_PASSWORD: ufdr_password
      POSTGRES_DB: ufdr_db

    volumes:
      - postgres_data:/var/lib/postgresql/data


  neo4j:
    image: neo4j:5
    container_name: ufdr-neo4j

    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/password

    volumes:
      - neo4j_data:/data


  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: ufdr-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


  redis:
    image: redis:7-alpine
    container_name: ufdr-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:

  postgres_data:

  neo4j_data:

  qdrant_data:

  redis_data: